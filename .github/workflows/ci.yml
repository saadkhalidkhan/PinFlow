name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :pinflow:testDebugUnitTest :sample:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble sample debug
        run: ./gradlew :sample:assembleDebug --no-daemon --stacktrace

      - name: Generate Dokka HTML
        run: ./gradlew :pinflow:dokkaGeneratePublicationHtml --no-daemon --stacktrace

      - name: Verify Dokka output
        run: |
          if [ ! -f pinflow/build/dokka/html/index.html ]; then
            echo "Dokka HTML missing — listing pinflow/build:"
            find pinflow/build -name "index.html" 2>/dev/null || true
            exit 1
          fi

      - name: Upload Dokka artifact
        uses: actions/upload-artifact@v4
        with:
          name: dokka-html
          path: pinflow/build/dokka/html
          if-no-files-found: error
